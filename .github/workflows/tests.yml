name: Validate public source
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install "./python[test]"
      - run: python tools/audit_release.py
      - run: python -m pytest python/tests -q
  R:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          working-directory: R
          extra-packages: any::pkgload
      - name: Test retained estimators and API
        shell: Rscript {0}
        run: |
          pkgload::load_all("R")
          testthat::test_dir("R/tests/testthat", stop_on_failure = TRUE)
      - run: R CMD build R
      - run: R CMD check --no-manual fastrcsdid_1.0.0.tar.gz
